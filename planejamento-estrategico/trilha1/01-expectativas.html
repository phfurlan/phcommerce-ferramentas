<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expectativas – Planejamento Estratégico</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body data-page="exp" data-base="../" data-cor="azul">
<main class="pagina">
  <div class="titulo-pg">
    <span class="etiqueta">Trilha 1 · Abertura</span>
    <h1>🙋 Expectativas</h1>
    <p>Conte o que você espera destes encontros. Isso ajuda o instrutor e você mesmo a acompanhar o que aprendeu.</p>
  </div>
  <section class="cartao azul">
    <h2>Minhas expectativas</h2>
    <div class="corpo">
      <div class="campo"><label for="e1">O que espero em relação a estes encontros? <button type="button" class="dica-btn" data-dica="Pense em algo prático: organizar a empresa, vender mais, ter metas claras, aprender a priorizar.">💡 Ver dica</button></label>
        <textarea id="e1" data-k="espero" rows="4" placeholder="Ex.: Quero sair com um plano simples para organizar minha empresa."></textarea></div>
      <div class="campo"><label for="e2">Quais questões eu gostaria que fossem respondidas nestes encontros? <button type="button" class="dica-btn" data-dica="Escreva dúvidas reais do seu dia a dia: 'Como definir metas?', 'Como saber se estou indo bem?'.">💡 Ver dica</button></label>
        <textarea id="e2" data-k="questoes" rows="4" placeholder="Ex.: Como definir metas que a equipe consiga cumprir?"></textarea></div>
    </div>
  </section>
</main>
<script src="../js/app.js"></script>
<script>PE.pagina({});</script>
</body>
</html>
